name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  neutral:
    name: No vendor detail in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-neutral.sh

  python:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTDESK_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    name: Build the web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  renderer:
    name: Test the renderer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The schema the Python side ships is the renderer's, byte for byte.
      - run: cmp schema/slide.json ../src/postdesk/maker/slide.schema.json

  docker:
    name: Build the images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.app -t postdesk:ci .
      - run: docker build -f docker/Dockerfile.renderer -t postdesk-renderer:ci .
      # The entrypoint only waits for a database before `serve` and `cron`.
      - run: docker run --rm postdesk:ci postdesk version
      # Without a database, `serve` must give up with a clear message, not hang.
      - run: |
          set +e
          out=$(docker run --rm -e POSTDESK_DB_WAIT_TRIES=2 -e DATABASE_URL=postgresql+psycopg://x:x@localhost:1/x postdesk:ci postdesk serve 2>&1)
          code=$?
          echo "$out" | tail -3
          [ $code -ne 0 ] && echo "$out" | grep -q "check DATABASE_URL"
      # The renderer image renders the example slide from inside the container.
      - run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/examples:/examples:ro" -v "$PWD/out:/out" postdesk-renderer:ci \
            node dist/cli.js render --spec /examples/slide.json --out /out/slide.jpg
          test "$(head -c 2 out/slide.jpg | od -An -tx1 | tr -d ' ')" = "ffd8"
