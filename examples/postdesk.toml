# postdesk.toml: everything that is not a secret. Copy to the repo root and edit.

[account]
handle = "yourhandle"                 # your Instagram username, without the @
site = "https://example.com"          # what "link in bio" points at
timezone = "Europe/London"            # IANA name; every time below is in it
audience = "people who bake at home"  # one line the writer keeps in mind

[schedule]
feed_slot = "18:00"        # when a feed post goes out, if you accept the suggestion
story_slot = "18:15"       # a Story goes 15 minutes after its post, or here on its own
max_feed_per_day = 1
max_story_per_day = 1
min_lead_hours = 2         # never suggest a time closer than this
story_frame_gap_minutes = 2            # frames of a multi-frame Story go out this far apart
max_per_run = 3            # at most this many posts per publisher pass, even if more are due
publisher_hours = ["06:00", "21:00"]   # the publisher only posts between these

[voice]
file = "voice.md"          # how you sound; the writer and the editor both read it
hashtags = ["#homebaking", "#sourdough", "#weekendbake"]   # the fixed set captions draw from
max_hashtags = 5
retired_phrases = ["game-changer", "elevate", "not just X, it's Y"]

[theme]
name = "default"           # renderer/themes/<name>/theme.json, or themes/<name>/ here (docs/themes.md)

[sources]
# What you post about. The scout files a card in Planned for each new item
# (docs/sources.md). An entry's name is its source type unless it says `type`,
# so two feeds can sit side by side.
# rss = { url = "https://example.com/feed.xml", template = "article" }
# news = { type = "rss", url = "https://example.org/news.atom" }
markdown = { path = "./posts", template = "article" }
# A link you paste on the board (or with `link` in POST /api/cards) is the `url` source; it needs no entry.

[scout]
every_hours = 2            # how often it looks
hours = ["06:00", "21:00"] # and between when, in your timezone
days = 3                   # how far back an item may be
max_per_run = 5            # new cards a run at most; the rest wait for the next

[partner]
# The partner may search the web to check a date or a name: only on the
# source's own site and these. web_search = false turns it off.
allowed_domains = []       # e.g. ["en.wikipedia.org"]
web_search = true
max_searches = 5           # per turn; each costs a cent

[images]
# Where a slide's picture may come from (docs/images.md): the source's own
# page, Wikimedia Commons (open licences only), the subject's own Instagram
# account through the API, a photo you attach. Leave one out to turn it off.
sources = ["page", "wikimedia", "business_discovery", "attachment"]

[review]
max_rounds = 2             # revisions the editor may ask for before the card is held for you
[review.extra_checks]
# Your own checks, one sentence each. The editor adds them to its six
# (voice, facts, rights, ai-label, accessibility, links) and checks each one.
# prices = "No price is stated for a single item."
# claims = "Nothing is called healthy, healing or good for you."

[llm]
partner = { model = "claude-opus-5-5", effort = "medium" }    # writes the brief, talks with you
editor  = { model = "claude-opus-5-5", effort = "medium" }    # checks the post, fresh context
maker   = { model = "claude-sonnet-5-5", effort = "low" }     # writes the words
pick    = { model = "claude-haiku-5-5", effort = "low" }      # picks a picture from an Instagram account
monthly_usd = 30           # at this, the agents stop until you raise it or the month turns; you are told

[telegram]
digest_at = "08:00"        # the daily summary of what needs you
mode = "auto"              # auto: a webhook if PUBLIC_BASE_URL is public https, else polling; or "polling", "webhook"

# Optional one-way notices besides Telegram (docs/notify.md); secrets live in .env.
[notify]
# [notify.slack]                                   # SLACK_WEBHOOK_URL
# events = ["brief_ready", "awaiting_approval", "live", "on_hold", "spend_ceiling"]   # default: all
# [notify.webhook]                                 # NOTIFY_WEBHOOK_URL; signed with POSTDESK_SECRET_KEY
# [notify.email]                                   # SMTP_* or RESEND_API_KEY, and SMTP_FROM
# to = "you@example.com"
