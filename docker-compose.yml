# `docker compose up -d`: Postgres, the app and the slide renderer.
# Secrets come from .env beside this file; the rest from postdesk.toml.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postdesk
      POSTGRES_PASSWORD: postdesk
      POSTGRES_DB: postdesk
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postdesk"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postdesk:postdesk@db:5432/postdesk
      POSTDESK_DATA_DIR: /data
      POSTDESK_CONFIG: /app/postdesk.toml
      RENDERER_URL: http://renderer:3100
      RENDERER_TOKEN: ${RENDERER_TOKEN:-change-me}
    volumes:
      - data:/data
      - ./postdesk.toml:/app/postdesk.toml:ro
      - ./voice.md:/app/voice.md:ro
      - ./templates:/app/templates:ro
    ports:
      - "${POSTDESK_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      renderer:
        condition: service_healthy
    restart: unless-stopped

  renderer:
    build:
      context: .
      dockerfile: docker/Dockerfile.renderer
    environment:
      RENDERER_TOKEN: ${RENDERER_TOKEN:-change-me}
    volumes:
      # Your own themes (docs/themes.md): a folder per theme.
      - ./themes:/themes:ro
    restart: unless-stopped

volumes:
  db:
  data:
