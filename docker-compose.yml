# `docker compose up -d`: Postgres and the app. The slide renderer joins in M1.
# Secrets come from .env beside this file; the rest from postdesk.toml.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postdesk
      POSTGRES_PASSWORD: postdesk
      POSTGRES_DB: postdesk
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postdesk"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postdesk:postdesk@db:5432/postdesk
      POSTDESK_DATA_DIR: /data
      POSTDESK_CONFIG: /app/postdesk.toml
    volumes:
      - data:/data
      - ./postdesk.toml:/app/postdesk.toml:ro
    ports:
      - "${POSTDESK_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
  data:
