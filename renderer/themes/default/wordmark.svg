<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30" fill="none">
  <!-- Three stacked slides: the mark of the default theme. Drawn in
       currentColor so the renderer can set it for a light or dark ground. -->
  <rect x="2" y="10" width="18" height="18" rx="3" fill="currentColor" fill-opacity="0.35"/>
  <rect x="6" y="6" width="18" height="18" rx="3" fill="currentColor" fill-opacity="0.6"/>
  <rect x="10" y="2" width="18" height="18" rx="3" fill="currentColor"/>
</svg>
