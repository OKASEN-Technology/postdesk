# What happened, why it matters, what to watch: for a piece of news.
name: explainer
description: A cover, then what happened, why it matters and what to watch next, a call to action, and a Story.
kind: carousel
kicker: "{{ facts.extra.kicker or 'Explainer' }}"

slides:
  - type: cover
    if: facts.hero
    brief: "The hook: a headline of 6 words or fewer, and one line of promise under it."
    fields: [headline, sub]
    fixed: { kicker: "{{ kicker }}", kicker_sub: "{{ month }}", image: "{{ facts.hero }}", link: "{{ account.site }}" }

  - type: cover
    unless: facts.hero
    brief: >-
      The hook: a headline of 6 words or fewer, and one line of promise under it. No photo, so `figure` fills
      the top half: the piece's most striking number, or empty if it has none.
    fields: [headline, sub, figure]
    fixed: { kicker: "{{ kicker }}", kicker_sub: "{{ month }}", link: "{{ account.site }}" }

  - type: statement
    brief: "What happened, plainly."
    fields: [headline, headline_em, body, source]
    fixed: { kicker: "What happened" }

  - type: statement
    brief: "Why it matters to the people this account posts for."
    fields: [headline, headline_em, body, source]
    fixed: { kicker: "Why it matters" }

  - type: statement
    brief: "What to watch next: a date, a decision, a thing to try."
    fields: [headline, headline_em, body, source]
    fixed: { kicker: "What to watch" }

  - type: cta
    brief: >-
      One action: read the full piece via the link in bio. `headline` is the start, `headline_em` the last
      2 or 3 words in italic.
    fields: [headline, headline_em, body]
    fixed: { kicker: "{{ kicker }}" }

story:
  brief: "A 9:16 companion: the headline in 3 to 8 words, one line ending on what is behind the link."
  fields: [headline, line]
